function drawMissingStroke(item){
 const {word,missing,paths,hidden}=item;
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');

 return svg;

// 100道独立缺笔画题：每题隐藏一整笔。相同汉字可缺不同笔画。
const strokeQuestions=[];
for(let i=0;i<strokeDrawings.length;i++){
  const base=strokeDrawings[i];
  for(let j=0;j<base[2].length;j++){
    let p=base[2][j];
    // 一个 SVG 路径代表一整笔；以方向及走势判断笔画类型。
    let strokeType;
    const coords=[...p.matchAll(/[-]?\d+(?:\.\d+)?/g)].map(x=>+x[0]);
    const first=coords.slice(0,2),last=coords.slice(-2);
    const dx=last[0]-first[0],dy=last[1]-first[1];
    if(p.includes('Q'))strokeType=dx<0?'丿':'㇏';
    else if(Math.abs(dx)<9 && Math.abs(dy)>15)strokeType='丨';
    else if(Math.abs(dy)<9 && Math.abs(dx)>15)strokeType='一';
    else if(dx<0 && dy>0)strokeType='丿';
    else strokeType='丶';
    strokeQuestions.push({word:base[0],missing:strokeType,paths:base[2],hidden:j});
  }
}
// 对少数笔画的规范名称进行人工校正。
const strokeOverrides={'十:1':'丨','土:0':'丨','工:1':'丨','干:2':'丨','王:1':'丨','丰:3':'丨','上:0':'丨','下:2':'丶','大:2':'丿','大:3':'㇏','太:2':'丿','太:3':'㇏','太:4':'丶','小:1':'丿','小:2':'丶','田:2':'丨','中:3':'丨','人:0':'丿','人:1':'㇏','八:0':'丿','八:1':'㇏'};
for(const q of strokeQuestions){const override=strokeOverrides[q.word+':'+q.hidden];if(override)q.missing=override;}

const hundredStrokeQuestions=strokeQuestions.slice(0,100);

const twoHundredWords=wordBank.slice(0,200);
const oneHundredTenSentences=sentences.slice(0,110);
// 难度比例：每种题型20%简单、70%中等、10%困难。
function difficultyPool(type,count){
 const easy=count*.2, medium=count*.7;
 return Array.from({length:count},(_,i)=>({type,id:i,level:i<easy?'简单':i<easy+medium?'中等':'困难'}));
}
const allQuestions=[...difficultyPool('stroke',100),...difficultyPool('word',200),...difficultyPool('sentence',110)];

let activeGroup=1;const STORAGE_KEY="chinese-game-five-groups-v1";
function getScores(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{}}catch(e){return {}}}
function saveScore(){let scores=getScores();scores[activeGroup]=score;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(scores))}catch(e){alert("无法保存成绩，请拍照记录积分。")}}
function showLeaderboard(){["home","game","result"].forEach(id=>$(id).classList.add("hidden"));$("leaderboard").classList.remove("hidden");let scores=getScores();$("leaderRows").innerHTML=[1,2,3,4,5].map(n=>`<p class="question" style="margin:12px 0;padding:10px;border-radius:12px;background:#f1f9ff">第${n}组：<b>${Number.isFinite(scores[n])?scores[n]+" 分":"尚未作答"}</b></p>`).join("")}
function backHome(){["game","result","leaderboard"].forEach(id=>$(id).classList.add("hidden"));$("home").classList.remove("hidden")}
function resetScores(){if(confirm("确定清空五个小组的所有成绩吗？此操作不能撤销。")){localStorage.removeItem(STORAGE_KEY);showLeaderboard()}}
let autoNext=null;let mode,queue=[],index=0,score=0,attempts=0,correct=0,current=null,selected=[],timer=null,left=0,total=0,locked=false;
const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pool(){return shuffle(allQuestions)}function start(m){activeGroup=Number($("group").value);if(Object.prototype.hasOwnProperty.call(getScores(),activeGroup)&&!confirm(`第${activeGroup}组已有成绩，重新比赛会覆盖原有积分。确定继续吗？`))return;mode=m;queue=pool();index=0;score=attempts=correct=0;total=Number($('duration').value)*60;left=total;$('home').classList.add('hidden');$('game').classList.remove('hidden');$('mode').textContent=m==='stroke'?'✏️ 补笔画':m==='sentence'?'🧩 组词成句':'🏆 三合一挑战';updateClock();if(total)timer=setInterval(()=>{left--;updateClock();if(left<=0)finish()},1000);next()}function updateClock(){let t=total?left:0;$('time').textContent=total?`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`:'不限时';$('bar').style.width=total?`${100*(1-left/total)}%`:'0%'}function next(){clearTimeout(autoNext);if(index>=queue.length){finish(true);return}current=queue[index++];selected=[];locked=false;$('number').textContent=attempts+1;$('score').textContent=score;$('feedback').textContent='';$('next').classList.add('hidden');$('check').classList.remove('hidden');$('skip').classList.remove('hidden');$('answer').textContent='';let {type,id,level}=current;$('mode').textContent='第'+activeGroup+'组 · '+level+'题（'+({简单:10,中等:20,困难:30}[level])+'分）';$('glyph').textContent='';let area=$('choices');area.innerHTML='';if(type==='stroke'){let {word,missing:stroke}=hundredStrokeQuestions[id];$('question').textContent='观察下面的汉字，找出缺少的一整笔。';$('glyph').appendChild(drawMissingStroke(hundredStrokeQuestions[id]));let opts=shuffle([...new Set([stroke,...shuffle(['一','丨','丿','丶','乛','亅','乚','㇏']).filter(x=>x!==stroke).slice(0,3)])]);opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{selected=[x];[...area.children].forEach(c=>c.classList.toggle('selected',c===b))};area.appendChild(b)})}else if(type==='word'){const [word,a,b]=twoHundredWords[id];$('question').textContent='请选出两个字，组成正确的词语。';$('glyph').textContent='🧩';const pool=shuffle([...new Set(wordBank.flatMap(x=>x.slice(1)))]).filter(x=>x!==a&&x!==b);let tiles=shuffle([{t:a,id:0},{t:b,id:1},...pool.slice(0,4).map((t,i)=>({t,id:i+2}))]);tiles.forEach(obj=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=obj.t;btn.onclick=()=>{if(locked)return;let idx=selected.indexOf(obj.id);if(idx>=0)selected.splice(idx,1);else if(selected.length<2)selected.push(obj.id);$('answer').textContent=selected.map(id=>tiles.find(x=>x.id===id).t).join('');[...area.children].forEach((b,i)=>b.classList.toggle('selected',selected.includes(tiles[i].id)))};area.appendChild(btn)});current={type,id,level,tiles};}else{$('question').textContent='请点击词语卡片，排列成通顺的句子。';let parts=oneHundredTenSentences[id];shuffle(parts.map((word,i)=>({word,i}))).forEach(obj=>{let b=document.createElement('button');b.className='choice';b.textContent=obj.word;b.onclick=()=>{if(locked)return;let at=selected.indexOf(obj.i);if(at>=0)selected.splice(at,1);else selected.push(obj.i);drawAnswer(parts);b.classList.toggle('selected',selected.includes(obj.i))};area.appendChild(b)})}}function drawAnswer(parts){$('answer').textContent=selected.map(i=>parts[i]).join(' ')+'。'}function check(){if(locked)return;let {type,id}=current;let ok;if(type==='stroke'){if(!selected.length)return;ok=selected[0]===hundredStrokeQuestions[id].missing}else if(type==='word'){if(selected.length!==2)return;const tiles=current.tiles;ok=selected.map(i=>tiles.find(x=>x.id===i).t).join('')===twoHundredWords[id][0]}else{if(selected.length!==oneHundredTenSentences[id].length)return;ok=selected.every((x,i)=>x===i)}locked=true;attempts++;if(ok){correct++;let points={简单:10,中等:20,困难:30}[current.level];score+=points;$('feedback').textContent='🎉 答对了！+'+points+'分'}else{$('feedback').textContent=type==='stroke'?'💡 正确笔画：'+hundredStrokeQuestions[id].missing+'（完整字：'+hundredStrokeQuestions[id].word+'）':type==='word'?'💡 正确词语：'+twoHundredWords[id][0]:'💡 正确句子：'+oneHundredTenSentences[id].join('')+'。'}$('score').textContent=score;$('check').classList.add('hidden');$('skip').classList.add('hidden');if(ok){autoNext=setTimeout(()=>{if(!document.getElementById('game').classList.contains('hidden'))next()},550)}else{$('next').classList.remove('hidden')}}function skipQuestion(){if(locked||$('game').classList.contains('hidden'))return;locked=true;attempts++;clearTimeout(autoNext);next()}function finish(exhausted=false){clearTimeout(autoNext);clearInterval(timer);$('game').classList.add('hidden');$('result').classList.remove('hidden');saveScore();$('summary').textContent=`第${activeGroup}组总积分：${score} 分！${exhausted?'本轮410题已全部出现，没有重复题目。':''}`}
